<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FAD · Closed-form fisheye (2D)</title>
    <style>
      :root {
        --bg: #0f0f12;
        --panel: #17171b;
        --line: #2a2a31;
        --fg: #d7d7db;
        --muted: #8a8a93;
        --accent: #c81e3c;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
        display: grid;
        grid-template-columns: 1fr 260px;
        height: 100vh;
      }
      #stage { display: grid; place-items: center; padding: 16px; min-width: 0; min-height: 0; }
      #gl {
        display: block;
        background: #000;
        border: 1px solid var(--line);
        border-radius: 4px;
        cursor: grab;
        touch-action: none;
      }
      #panel {
        background: var(--panel);
        border-left: 1px solid var(--line);
        padding: 18px 16px;
        overflow-y: auto;
      }
      h1 { font-size: 13px; font-weight: 600; margin: 0 0 2px; letter-spacing: 0.02em; }
      .sub { color: var(--muted); font-size: 11px; margin-bottom: 18px; }
      .group { margin-bottom: 16px; }
      label { display: block; color: var(--muted); font-size: 11px;
              text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .val { color: var(--fg); font-variant-numeric: tabular-nums; font-size: 12px; }
      input[type="range"] { width: 100%; accent-color: var(--accent); }
      select, button {
        width: 100%; background: #202027; color: var(--fg);
        border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font: inherit;
      }
      button { cursor: pointer; }
      button:hover { border-color: var(--muted); }
      .check { display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
               color: var(--fg); text-transform: none; letter-spacing: 0; font-size: 12px; }
      .check input { accent-color: var(--accent); }
      hr { border: none; border-top: 1px solid var(--line); margin: 16px 0; }
      .hint { color: var(--muted); font-size: 11px; margin-top: 10px; }
      code { color: var(--fg); background: #000; padding: 1px 4px; border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="gl"></canvas>
    </div>

    <aside id="panel">
      <h1>Closed-form fisheye</h1>
      <div class="sub">FAD <code>trans2D</code> · radial warp + round domain</div>

      <div class="group">
        <div class="row"><label for="beta">Magnification β</label><span class="val" id="betaVal">3.00</span></div>
        <input id="beta" type="range" min="0" max="12" step="0.1" value="3" />
      </div>

      <div class="group">
        <div class="row"><label for="gamma">Domain radius γ</label><span class="val" id="gammaVal">0.60</span></div>
        <input id="gamma" type="range" min="0.1" max="1.5" step="0.01" value="0.6" />
      </div>

      <div class="group">
        <div class="row"><label for="filter">Filter weight</label><span class="val" id="filterVal">1.00</span></div>
        <input id="filter" type="range" min="0" max="1" step="0.01" value="1" />
      </div>

      <div class="group">
        <label for="kernel">Radial kernel</label>
        <select id="kernel">
          <option value="fisheye">fisheye — (1+β)r / (βr+1)</option>
          <option value="hyper">hyper — tanh(βr)</option>
          <option value="logistic">logistic — 2/(1+e^−2βr) − 1</option>
        </select>
      </div>

      <div class="group">
        <label class="check"><input id="linearCenter" type="checkbox" /> Linear centre (legible zone)</label>
        <div class="row"><label for="linExtent">Centre extent</label><span class="val" id="linExtentVal">0.60</span></div>
        <input id="linExtent" type="range" min="0" max="1" step="0.01" value="0.6" />
      </div>

      <hr />

      <div class="group">
        <label class="check"><input id="showImage" type="checkbox" checked /> Show image</label>
        <label class="check"><input id="showGrid" type="checkbox" checked /> Show grid</label>
        <label class="check"><input id="followMouse" type="checkbox" checked /> Drag to move focus</label>
      </div>

      <div class="group">
        <div class="row"><label for="meshN">Mesh resolution</label><span class="val" id="meshNVal">96</span></div>
        <input id="meshN" type="range" min="6" max="200" step="1" value="96" />
      </div>

      <hr />

      <div class="group">
        <label for="source">Texture</label>
        <select id="source">
          <option value="metro">DC Metro map (FAD demo)</option>
          <option value="test">Test pattern (square)</option>
          <option value="wide">Test pattern (wide 8:3)</option>
          <option value="tall">Test pattern (tall 3:8)</option>
        </select>
      </div>

      <div class="group">
        <label for="file">Load image</label>
        <input id="file" type="file" accept="image/*" />
      </div>

      <button id="reset">Reset parameters</button>

      <div class="hint">Press and drag on the canvas to move the focus; release to freeze it in place. Drop an image file onto the canvas to load it.</div>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
